<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول / إنشاء حساب</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo & Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    },
                    fontFamily: {
                        sans: ['Cairo', 'Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Floating Input Container */
        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .input-group label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            transition: all 0.3s ease;
            pointer-events: none;
            color: #94a3b8;
        }

        /* Float effect */
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 6px;
            transform: translateY(0);
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 600;
        }

        /* Form switch smooth animation */
        .form-container {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toggle-btn {
            transition: all 0.3s ease;
        }

        .active-tab {
            background-color: #0284c7;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        /* Custom Toast Notification Styling */
        #toast {
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            transform: translateY(-100px);
            opacity: 0;
        }

        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-6 text-slate-100 relative overflow-x-hidden">

    <!-- Alert Toast Message -->
    <div id="toast" class="fixed top-5 right-5 z-50 flex items-center gap-3 bg-slate-800/95 border border-slate-700 text-white px-5 py-3.5 rounded-xl shadow-2xl min-w-[300px] max-w-md">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-xl flex-shrink-0"></i>
        <div class="flex-1">
            <h4 id="toast-title" class="font-bold text-sm">تم بنجاح</h4>
            <p id="toast-desc" class="text-xs text-slate-300">تمت العملية المطلوب إنجازها.</p>
        </div>
    </div>

    <!-- Background Decorative Bubbles -->
    <div class="absolute -top-20 -right-20 w-80 h-80 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -left-20 w-80 h-80 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Form Wrapper -->
    <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 relative z-10 my-auto">
        
        <!-- Header Logo & Title -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500 to-blue-600 text-white shadow-lg shadow-sky-500/30 mb-3">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-wide">مرحباً بك</h2>
            <p class="text-xs text-slate-400 mt-1">قم بتسجيل الدخول أو إنشاء حساب أونلاين</p>
        </div>

        <!-- Form Switch Tabs -->
        <div class="flex bg-slate-900/60 p-1.5 rounded-2xl mb-6 border border-slate-700/50 relative">
            <button id="tab-signin" type="button" onclick="switchForm('signin')" class="toggle-btn flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-xl active-tab flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>تسجيل الدخول</span>
            </button>
            <button id="tab-signup" type="button" onclick="switchForm('signup')" class="toggle-btn flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-xl text-slate-400 hover:text-white flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i>
                <span>حساب جديد</span>
            </button>
        </div>

        <!-- SIGN IN FORM -->
        <form id="signin-form" class="space-y-4">
            <!-- Email Input -->
            <div class="input-group">
                <input type="email" id="signin-email" placeholder=" " required class="pt-6 pb-2 px-4 rounded-xl text-sm text-white focus:outline-none">
                <label for="signin-email" class="right-4">البريد الإلكتروني</label>
                <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            </div>

            <!-- Password Input -->
            <div class="input-group">
                <input type="password" id="signin-password" placeholder=" " required class="pt-6 pb-2 px-4 rounded-xl text-sm text-white focus:outline-none">
                <label for="signin-password" class="right-4">كلمة المرور</label>
                <button type="button" onclick="togglePasswordVisibility('signin-password', this)" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm focus:outline-none">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex items-center justify-between text-xs pt-1">
                <label class="flex items-center gap-2 cursor-pointer text-slate-300">
                    <input type="checkbox" class="rounded border-slate-700 bg-slate-900 text-sky-500 focus:ring-sky-500/30 w-4 h-4">
                    <span>تذكرني</span>
                </label>
                <a href="#" id="forgot-password-btn" class="text-sky-400 hover:text-sky-300 transition">نسيت كلمة المرور؟</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="signin-submit-btn" class="w-full py-3.5 px-4 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-sky-500/25 transition duration-300 flex items-center justify-center gap-2 text-sm mt-2">
                <span>دخول</span>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </form>

        <!-- SIGN UP FORM (Hidden by default) -->
        <form id="signup-form" class="space-y-4 hidden">
            <!-- Full Name Input -->
            <div class="input-group">
                <input type="text" id="signup-name" placeholder=" " required class="pt-6 pb-2 px-4 rounded-xl text-sm text-white focus:outline-none">
                <label for="signup-name" class="right-4">الاسم الكامل</label>
                <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            </div>

            <!-- Email Input -->
            <div class="input-group">
                <input type="email" id="signup-email" placeholder=" " required class="pt-6 pb-2 px-4 rounded-xl text-sm text-white focus:outline-none">
                <label for="signup-email" class="right-4">البريد الإلكتروني</label>
                <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            </div>

            <!-- Password Input -->
            <div class="input-group">
                <input type="password" id="signup-password" placeholder=" " required class="pt-6 pb-2 px-4 rounded-xl text-sm text-white focus:outline-none">
                <label for="signup-password" class="right-4">كلمة المرور</label>
                <button type="button" onclick="togglePasswordVisibility('signup-password', this)" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm focus:outline-none">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <!-- Confirm Password Input -->
            <div class="input-group">
                <input type="password" id="signup-confirm-password" placeholder=" " required class="pt-6 pb-2 px-4 rounded-xl text-sm text-white focus:outline-none">
                <label for="signup-confirm-password" class="right-4">تأكيد كلمة المرور</label>
                <button type="button" onclick="togglePasswordVisibility('signup-confirm-password', this)" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm focus:outline-none">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <!-- Terms & Conditions Checkbox -->
            <div class="flex items-center gap-2 text-xs pt-1">
                <input type="checkbox" id="terms" required class="rounded border-slate-700 bg-slate-900 text-sky-500 focus:ring-sky-500/30 w-4 h-4">
                <label for="terms" class="text-slate-300">أوافق على <a href="#" class="text-sky-400 underline">الشروط والأحكام</a></label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="signup-submit-btn" class="w-full py-3.5 px-4 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-sky-500/25 transition duration-300 flex items-center justify-center gap-2 text-sm mt-2">
                <span>إنشاء الحساب</span>
                <i class="fa-solid fa-user-check"></i>
            </button>
        </form>

        <!-- Social Login Separator -->
        <div class="relative flex py-5 items-center my-1">
            <div class="flex-grow border-t border-slate-700/60"></div>
            <span class="flex-shrink mx-4 text-xs text-slate-400">أو المتابعة باستخدام</span>
            <div class="flex-grow border-t border-slate-700/60"></div>
        </div>

        <!-- Social Buttons Container -->
        <div class="grid grid-cols-3 gap-3">
            <button type="button" onclick="socialLogin('Google')" class="flex items-center justify-center py-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-xl transition duration-200">
                <i class="fa-brands fa-google text-red-400 text-lg"></i>
            </button>
            <button type="button" onclick="socialLogin('Apple')" class="flex items-center justify-center py-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-xl transition duration-200">
                <i class="fa-brands fa-apple text-white text-lg"></i>
            </button>
            <button type="button" onclick="socialLogin('GitHub')" class="flex items-center justify-center py-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-xl transition duration-200">
                <i class="fa-brands fa-github text-slate-200 text-lg"></i>
            </button>
        </div>
        
    </div>

    <!-- Firebase Firebase SDK Module Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 🔑 إعدادات الفايربيس (Firebase Configuration)
        // قم باستبدال القيم التالية بمعلومات مشروعك من كونسول الفايربيس (Firebase Console)
        // =========================================================================
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.firebasestorage.app",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // تهيئة الفايربيس
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (error) {
            console.error("Firebase init error:", error);
        }

        // ربط أحداث النموذج
        document.getElementById('signup-form').addEventListener('submit', handleSignUp);
        document.getElementById('signin-form').addEventListener('submit', handleSignIn);
        document.getElementById('forgot-password-btn').addEventListener('click', handleForgotPassword);

        async function handleSignUp(e) {
            e.preventDefault();

            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim().toLowerCase();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;
            const submitBtn = document.getElementById('signup-submit-btn');

            // 1. التحقق من مطابقة كلمتي المرور
            if (password !== confirmPassword) {
                window.showToast('خطأ في البيانات', 'كلمتا المرور غير متطابقتين!', 'error');
                return;
            }

            if (password.length < 6) {
                window.showToast('كلمة مرور ضعيفة', 'يجب أن تحتوي كلمة المرور على 6 أحرف/أرقام على الأقل', 'warning');
                return;
            }

            // تعطيل الزر وعرض حالة التحميل
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span> جاري إنشاء الحساب...</span>';

            try {
                // 2. إنشاء المستخدم في Firebase Auth أونلاين
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // تحديث اسم المستخدم في Auth
                await updateProfile(user, { displayName: name });

                // 3. تخزين بيانات المستخدم كاملة في مجموعات Firestore الخاصة بالإنترنت
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid);
                await setDoc(userDocRef, {
                    uid: user.uid,
                    name: name,
                    email: email,
                    createdAt: serverTimestamp(),
                    role: 'user'
                });

                window.showToast('تم إنشاء الحساب', 'تم التسجيل أونلاين وحفظ بياناتك بنجاح!', 'success');

                // إعادة تعيين النموذج
                document.getElementById('signup-form').reset();
                document.getElementById('signin-email').value = email;

                // التبديل التلقائي لنموذج تسجيل الدخول
                setTimeout(() => {
                    window.switchForm('signin');
                }, 1200);

            } catch (error) {
                console.error("Firebase Signup Error:", error.code, error.message);
                
                // معالجة خطأ وجود البريد مسبقاً وفق المطلوب
                if (error.code === 'auth/email-already-in-use') {
                    window.showToast('حساب موجود بالفعّل', 'يوجد حساب مسجل بهذا البريد الإلكتروني مسبقاً!', 'warning');
                } else if (error.code === 'auth/invalid-email') {
                    window.showToast('البريد غير صحيح', 'يرجى كتابة بريد إلكتروني بشكل صحيح.', 'error');
                } else {
                    window.showToast('فشل التسجيل', 'حدث خطأ في الاتصال بالخادم، يرجى المحاولة لاحقاً', 'error');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>إنشاء الحساب</span><i class="fa-solid fa-user-check"></i>';
            }
        }

        async function handleSignIn(e) {
            e.preventDefault();

            const email = document.getElementById('signin-email').value.trim().toLowerCase();
            const password = document.getElementById('signin-password').value;
            const submitBtn = document.getElementById('signin-submit-btn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span> جاري التحقق...</span>';

            try {
                // 1. تسجيل الدخول عبر Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. جلب بيانات ملف المستخدم من Firestore
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid);
                const userSnap = await getDoc(userDocRef);

                let userName = user.displayName || 'مستخدم';
                if (userSnap.exists()) {
                    userName = userSnap.data().name || userName;
                }

                window.showToast('تم تسجيل الدخول', `أهلاً بك مجدداً، ${userName}!`, 'success');

            } catch (error) {
                console.error("Firebase Signin Error:", error.code);

                // معالجة الأخطاء الدقيقة لحالة عدم وجود حساب أو كلمة مرور خاطئة
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    window.showToast('حساب غير موجود', 'لا يوجد حساب مرتبط بهذا البريد الإلكتروني، أو كلمة المرور غير صحيحة!', 'error');
                } else if (error.code === 'auth/wrong-password') {
                    window.showToast('كلمة المرور خاطئة', 'كلمة المرور التي أخلتها غير صحيحة!', 'error');
                } else if (error.code === 'auth/too-many-requests') {
                    window.showToast('تنبيه أمان', 'تم محاولة الدخول عدة مرات بشكل خاطئ، يرجى الانتظار قليلاً', 'warning');
                } else {
                    window.showToast('خطأ في الدخول', 'تأكد من البيانات المدخلة ومن الاتصال بالإنترنت', 'error');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>دخول</span><i class="fa-solid fa-arrow-left"></i>';
            }
        }

        async function handleForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('signin-email').value.trim();

            if (!email) {
                window.showToast('البريد المطلوب', 'يرجى إدخال البريد الإلكتروني في حقل الدخول أولاً', 'warning');
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                window.showToast('إعادة تعيين كلمة المرور', 'تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني بنجاح', 'info');
            } catch (error) {
                if (error.code === 'auth/user-not-found') {
                    window.showToast('حساب غير موجود', 'لا يوجد حساب مسجل بهذا البريد لإعادة التعيين!', 'error');
                } else {
                    window.showToast('خطأ', 'فشل إرسال البريد الإلكتروني، تحقق من صحة العنوان', 'error');
                }
            }
        }
    </script>

    <script>
        // Switch between Sign In and Sign Up Forms
        function switchForm(type) {
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');
            const tabSignin = document.getElementById('tab-signin');
            const tabSignup = document.getElementById('tab-signup');

            if (type === 'signin') {
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');

                tabSignin.classList.add('active-tab');
                tabSignin.classList.remove('text-slate-400');
                
                tabSignup.classList.remove('active-tab');
                tabSignup.classList.add('text-slate-400');
            } else {
                signupForm.classList.remove('hidden');
                signinForm.classList.add('hidden');

                tabSignup.classList.add('active-tab');
                tabSignup.classList.remove('text-slate-400');

                tabSignin.classList.remove('active-tab');
                tabSignin.classList.add('text-slate-400');
            }
        }

        // Toggle Password Visibility (Eye Icon)
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Mock Social Logins
        function socialLogin(provider) {
            showToast('تسجيل دخول سريع', `جاري الاتصال عبر ${provider}...`, 'info');
        }

        // Dynamic Toast Notification System
        let toastTimeout;
        function showToast(title, desc, type = 'success') {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastDesc = document.getElementById('toast-desc');
            const toastIcon = document.getElementById('toast-icon');

            toastTitle.innerText = title;
            toastDesc.innerText = desc;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-xl flex-shrink-0';
                toast.className = 'fixed top-5 right-5 z-50 flex items-center gap-3 bg-slate-800/95 border border-emerald-500/30 text-white px-5 py-3.5 rounded-xl shadow-2xl min-w-[300px] max-w-md';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-rose-400 text-xl flex-shrink-0';
                toast.className = 'fixed top-5 right-5 z-50 flex items-center gap-3 bg-slate-800/95 border border-rose-500/30 text-white px-5 py-3.5 rounded-xl shadow-2xl min-w-[300px] max-w-md';
            } else if (type === 'warning') {
                toastIcon.className = 'fa-solid fa-triangle-exclamation text-amber-400 text-xl flex-shrink-0';
                toast.className = 'fixed top-5 right-5 z-50 flex items-center gap-3 bg-slate-800/95 border border-amber-500/30 text-white px-5 py-3.5 rounded-xl shadow-2xl min-w-[300px] max-w-md';
            } else if (type === 'info') {
                toastIcon.className = 'fa-solid fa-circle-info text-sky-400 text-xl flex-shrink-0';
                toast.className = 'fixed top-5 right-5 z-50 flex items-center gap-3 bg-slate-800/95 border border-sky-500/30 text-white px-5 py-3.5 rounded-xl shadow-2xl min-w-[300px] max-w-md';
            }

            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // Export functions to window for Firebase script block usage
        window.switchForm = switchForm;
        window.showToast = showToast;
    </script>
</body>
</html>
