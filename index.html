<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECE LIBRARY</title>
    <!-- خط Cairo وأيقونات Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-hover: #5b4bc4;
            --secondary: #00b894;
            --accent: #ff7675;
            --warning: #fdcb6e;
            --bg-light: #f4f7fe;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --border-radius: 16px;
            --shadow: 0 10px 30px rgba(108, 92, 231, 0.08);
            --shadow-hover: 0 20px 40px rgba(108, 92, 231, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- شريط النافبار المتقدم --- */
        .navbar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(108, 92, 231, 0.1);
            padding: 1rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            font-size: 1.8rem;
            color: var(--primary);
            -webkit-text-fill-color: initial;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            color: white;
            border: none;
            padding: 0.7rem 1.4rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
        }

        /* --- الهيدر الاستعراضي --- */
        .hero {
            background: linear-gradient(135deg, #6c5ce7 0%, #81ecec 100%);
            color: white;
            padding: 3.5rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-radius: 0 0 40px 40px;
            margin-bottom: 2rem;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 0.8rem;
        }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* --- لوحة أدوات البحث والتصفية --- */
        .controls-card {
            max-width: 1200px;
            margin: -2.5rem auto 2rem auto;
            background: white;
            padding: 1.2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 1rem;
            position: relative;
            z-index: 10;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i.search-icon {
            position: absolute;
            right: 1.2rem;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .custom-input {
            width: 100%;
            padding: 0.85rem 3rem 0.85rem 1.2rem;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        .custom-input:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
        }

        /* --- تصميم القوائم المنسدلة المخصصة داخل الصفحة --- */
        .custom-dropdown {
            position: relative;
            width: 100%;
        }

        .dropdown-btn {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            font-size: 0.95rem;
            background-color: #f8fafc;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
        }

        .dropdown-btn i {
            color: var(--primary);
            transition: transform 0.3s;
        }

        .custom-dropdown.active .dropdown-btn i {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 1px solid #edf2f7;
            padding: 6px 0;
            display: none;
            z-index: 50;
            overflow: hidden;
        }

        .custom-dropdown.active .dropdown-menu {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-item {
            padding: 0.75rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background-color: #f1f0fe;
            color: var(--primary);
        }

        .dropdown-item.selected {
            background-color: #f1f0fe;
            color: var(--primary);
            font-weight: 700;
        }

        .dropdown-item i {
            font-size: 0.85rem;
            display: none;
        }

        .dropdown-item.selected i {
            display: inline-block;
        }

        /* --- شبكة عرض الكتب --- */
        .main-container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 0 1.5rem 3rem 1.5rem;
            flex-grow: 1;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .cover-container {
            position: relative;
            height: 280px;
            overflow: hidden;
            background-color: #e2e8f0;
        }

        .book-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            color: var(--primary);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .book-details {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .book-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        .book-author {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rating {
            color: var(--warning);
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            display: flex;
            gap: 2px;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            gap: 0.6rem;
        }

        .btn-read {
            flex: 1;
            background: #f1f0fe;
            color: var(--primary);
            text-align: center;
            padding: 0.65rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-read:hover {
            background: var(--primary);
            color: white;
        }

        .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #fff0f0;
            color: var(--accent);
        }

        .btn-icon:hover {
            background: var(--accent);
            color: white;
        }

        /* --- النوافذ المنبثقة (Modals) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-card {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            animation: modalSlide 0.3s ease-out;
            overflow: hidden;
        }

        @keyframes modalSlide {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            color: white;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        @media (max-width: 768px) {
            .controls-card {
                grid-template-columns: 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <!-- شريط النافبار -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fa-solid fa-shapes"></i>
                <span>ECE LIBRARY</span>
            </div>
            <div class="nav-actions">
                <button class="btn-main" onclick="openModal()">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add New Book</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- واجهة الترحيب -->
    <section class="hero">
        <div class="hero-content">
            <h1>عالمك المعرفي الذكي بين يديك</h1>
            <p>تصفح، ابحث، ونظم مجموعتك المفضلات من الكتب في منصة تفاعلية شاسعة.</p>
        </div>
    </section>

    <!-- لوحة البحث والتصفية -->
    <div class="controls-card">
        <div class="input-group">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="custom-input" placeholder="ابحث باسم الكتاب أو المؤلف..." oninput="filterBooks()">
        </div>
        
        <!-- قائمة التصنيفات المنسدلة المخصصة -->
        <div class="custom-dropdown" id="categoryDropdown">
            <div class="dropdown-btn" onclick="toggleDropdown('categoryDropdown')">
                <span id="selectedCategoryText">جميع التصنيفات</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="dropdown-menu">
                <div class="dropdown-item selected" onclick="selectOption('category', 'all', 'جميع التصنيفات', this)">
                    <span>جميع التصنيفات</span><i class="fa-solid fa-check"></i>
                </div>
                <div class="dropdown-item" onclick="selectOption('category', 'روايات', 'روايات وأدب', this)">
                    <span>روايات وأدب</span><i class="fa-solid fa-check"></i>
                </div>
                <div class="dropdown-item" onclick="selectOption('category', 'تطوير ذات', 'تطوير الذات', this)">
                    <span>تطوير الذات</span><i class="fa-solid fa-check"></i>
                </div>
                <div class="dropdown-item" onclick="selectOption('category', 'علوم وتكنولوجيا', 'علوم وتكنولوجيا', this)">
                    <span>علوم وتكنولوجيا</span><i class="fa-solid fa-check"></i>
                </div>
                <div class="dropdown-item" onclick="selectOption('category', 'تاريخ', 'تاريخ وحضارات', this)">
                    <span>تاريخ وحضارات</span><i class="fa-solid fa-check"></i>
                </div>
            </div>
        </div>

        <!-- قائمة الترتيب المنسدلة المخصصة -->
        <div class="custom-dropdown" id="sortDropdown">
            <div class="dropdown-btn" onclick="toggleDropdown('sortDropdown')">
                <span id="selectedSortText">الأحدث إضافة</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="dropdown-menu">
                <div class="dropdown-item selected" onclick="selectOption('sort', 'newest', 'الأحدث إضافة', this)">
                    <span>الأحدث إضافة</span><i class="fa-solid fa-check"></i>
                </div>
                <div class="dropdown-item" onclick="selectOption('sort', 'rating', 'الأعلى تقييماً', this)">
                    <span>الأعلى تقييماً</span><i class="fa-solid fa-check"></i>
                </div>
                <div class="dropdown-item" onclick="selectOption('sort', 'title', 'أبجديات (أ-ي)', this)">
                    <span>أبجدياً (أ-ي)</span><i class="fa-solid fa-check"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- المحتوى الرئيسي / الكتب -->
    <main class="main-container">
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-layer-group" style="color: var(--primary);"></i>
                <span>مكتبتك الحالية (<span id="booksCount">0</span>)</span>
            </div>
        </div>

        <div class="books-grid" id="booksGrid"></div>
    </main>

    <!-- نافذة إضافة كتاب Modal -->
    <div class="modal" id="addBookModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-book-medical"></i> إضافة كتاب جديد</h3>
                <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModal()"></i>
            </div>
            <div class="modal-body">
                <form id="addBookForm" onsubmit="addNewBook(event)" class="form-grid">
                    <div class="full-width">
                        <label class="form-label">عنوان الكتاب</label>
                        <input type="text" id="bookTitle" class="form-control" required placeholder="مثال: فن الحرب">
                    </div>
                    <div>
                        <label class="form-label">اسم الكاتب</label>
                        <input type="text" id="bookAuthor" class="form-control" required placeholder="سون تزو">
                    </div>
                    <div>
                        <label class="form-label">التصنيف</label>
                        <select id="bookCategory" class="form-control">
                            <option value="روايات">روايات وأدب</option>
                            <option value="تطوير ذات">تطوير الذات</option>
                            <option value="علوم وتكنولوجيا">علوم وتكنولوجيا</option>
                            <option value="تاريخ">تاريخ وحضارات</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">التقييم</label>
                        <select id="bookRating" class="form-control">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>
                            <option value="3">⭐⭐⭐ (3/5)</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">رابط صورة الغلاف</label>
                        <input type="url" id="bookCover" class="form-control" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="full-width">
                        <label class="form-label">رابط التحميل أو القراءة (PDF)</label>
                        <input type="url" id="bookLink" class="form-control" placeholder="https://example.com/file.pdf">
                    </div>
                    <div class="full-width" style="margin-top: 1rem;">
                        <button type="submit" class="btn-main" style="width: 100%; justify-content: center;">حفظ الكتاب</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentCategory = 'all';
        let currentSort = 'newest';

        let books = JSON.parse(localStorage.getItem('advanced_library_books')) || [
            {
                id: 1,
                title: "مقدمة ابن خلدون",
                author: "ابن خلدون",
                category: "تاريخ",
                rating: 5,
                cover: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500",
                link: "#"
            },
            {
                id: 2,
                title: "العادات الذرية",
                author: "جيمس كلير",
                category: "تطوير ذات",
                rating: 5,
                cover: "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=500",
                link: "#"
            },
            {
                id: 3,
                title: "الذكاء الاصطناعي والمستقبل",
                author: "د. أحمد علي",
                category: "علوم وتكنولوجيا",
                rating: 4,
                cover: "https://images.unsplash.com/photo-1532012197267-da84d127e765?w=500",
                link: "#"
            }
        ];

        function saveBooks() {
            localStorage.setItem('advanced_library_books', JSON.stringify(books));
        }

        function toggleDropdown(id) {
            const dropdown = document.getElementById(id);
            const isActive = dropdown.classList.contains('active');
            
            // إغلاق أي قائمة مفتوحة أخرى
            document.querySelectorAll('.custom-dropdown').forEach(d => d.classList.remove('active'));

            if (!isActive) {
                dropdown.classList.add('active');
            }
        }

        function selectOption(type, value, label, element) {
            if (type === 'category') {
                currentCategory = value;
                document.getElementById('selectedCategoryText').innerText = label;
            } else if (type === 'sort') {
                currentSort = value;
                document.getElementById('selectedSortText').innerText = label;
            }

            // تحديث الخيار المحدد شَكْليًا
            const parent = element.parentElement;
            parent.querySelectorAll('.dropdown-item').forEach(item => item.classList.remove('selected'));
            element.classList.add('selected');

            // إغلاق القائمة المنسدلة
            document.querySelectorAll('.custom-dropdown').forEach(d => d.classList.remove('active'));

            filterBooks();
        }

        function renderStars(rating) {
            let stars = '';
            for(let i = 0; i < 5; i++) {
                stars += `<i class="fa-${i < rating ? 'solid' : 'regular'} fa-star"></i>`;
            }
            return stars;
        }

        function displayBooks(data) {
            const grid = document.getElementById('booksGrid');
            const countElem = document.getElementById('booksCount');
            grid.innerHTML = '';
            countElem.innerText = data.length;

            if (data.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
                        <i class="fa-solid fa-folder-open" style="font-size: 3rem; margin-bottom: 1rem; color: #cbd5e1;"></i>
                        <h3>لا توجد نتائج مطابقة لمحدادت البحث!</h3>
                    </div>
                `;
                return;
            }

            data.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="cover-container">
                        <span class="badge">${book.category}</span>
                        <img src="${book.cover || 'https://via.placeholder.com/300x400?text=No+Cover'}" class="book-cover" alt="${book.title}">
                    </div>
                    <div class="book-details">
                        <h3 class="book-title">${book.title}</h3>
                        <p class="book-author"><i class="fa-regular fa-user"></i> ${book.author}</p>
                        <div class="rating">${renderStars(book.rating)}</div>
                        <div class="card-actions">
                            <a href="${book.link}" target="_blank" class="btn-read">
                                <i class="fa-solid fa-book-open"></i> قراءة
                            </a>
                            <button class="btn-icon" onclick="deleteBook(${book.id})" title="حذف الكتاب">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterBooks() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            let filtered = books.filter(b => {
                const matchSearch = b.title.toLowerCase().includes(searchVal) || b.author.toLowerCase().includes(searchVal);
                const matchCat = currentCategory === 'all' || b.category === currentCategory;
                return matchSearch && matchCat;
            });

            if (currentSort === 'newest') {
                filtered.sort((a, b) => b.id - a.id);
            } else if (currentSort === 'rating') {
                filtered.sort((a, b) => b.rating - a.rating);
            } else if (currentSort === 'title') {
                filtered.sort((a, b) => a.title.localeCompare(b.title, 'ar'));
            }

            displayBooks(filtered);
        }

        function addNewBook(e) {
            e.preventDefault();
            const newBook = {
                id: Date.now(),
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                category: document.getElementById('bookCategory').value,
                rating: parseInt(document.getElementById('bookRating').value),
                cover: document.getElementById('bookCover').value || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500',
                link: document.getElementById('bookLink').value || '#'
            };

            books.unshift(newBook);
            saveBooks();
            filterBooks();
            closeModal();
            document.getElementById('addBookForm').reset();
        }

        function deleteBook(id) {
            if (confirm('هل أنت متأكد من حذف هذا الكتاب من مجموعتك؟')) {
                books = books.filter(b => b.id !== id);
                saveBooks();
                filterBooks();
            }
        }

        function openModal() {
            document.getElementById('addBookModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('addBookModal').style.display = 'none';
        }

        // إغلاق القوائم عند النقر خارجها
        window.onclick = function(e) {
            const modal = document.getElementById('addBookModal');
            if (e.target === modal) closeModal();

            if (!e.target.closest('.custom-dropdown')) {
                document.querySelectorAll('.custom-dropdown').forEach(d => d.classList.remove('active'));
            }
        }

        filterBooks();
    </script>
</body>
</html>
